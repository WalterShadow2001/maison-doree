<svg width="220" height="60" viewBox="0 0 220 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C97C"/>
      <stop offset="50%" stop-color="#C9A961"/>
      <stop offset="100%" stop-color="#9C7B3F"/>
    </linearGradient>
    <linearGradient id="goldGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A961"/>
      <stop offset="100%" stop-color="#7A5C2E"/>
    </linearGradient>
  </defs>
  <!-- Decorative laurel wreath circle -->
  <g transform="translate(28, 30)">
    <circle cx="0" cy="0" r="24" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.6"/>
    <!-- MD monogram -->
    <text x="0" y="6" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="url(#goldGradDark)">MD</text>
    <!-- Laurel leaves -->
    <path d="M -22 0 Q -18 -8 -14 0 Q -18 8 -22 0 Z" fill="url(#goldGrad)" opacity="0.9"/>
    <path d="M 22 0 Q 18 -8 14 0 Q 18 8 22 0 Z" fill="url(#goldGrad)" opacity="0.9"/>
  </g>
  <!-- Text: Maison Dorée -->
  <text x="65" y="28" font-family="Georgia, serif" font-size="22" font-weight="600" fill="#1A1A1A" letter-spacing="1.5">
    Maison
    <tspan fill="url(#goldGradDark)">Dorée</tspan>
  </text>
  <text x="66" y="46" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#6B6B6B" letter-spacing="4">LOZA &amp; EVENTOS</text>
  <!-- Underline accent -->
  <line x1="65" y1="34" x2="215" y2="34" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.6"/>
</svg>
